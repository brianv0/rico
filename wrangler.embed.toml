# Fallback deploy: the same Worker with the static app embedded instead of Workers Assets (see scripts/build-embed.mjs).
# npm run deploy:embed
name = "rico"
main = "src/worker-embed.js"
compatibility_date = "2025-01-01"

# Served at https://ricorico.dev (the domain must be a zone in your Cloudflare account; deploy creates the DNS record)
routes = [{ pattern = "ricorico.dev", custom_domain = true }]

# Keep variables set in the Cloudflare dashboard (such as GITHUB_CLIENT_ID) when deploying from here.
keep_vars = true

[vars]
# GITHUB_CLIENT_ID (not secret; the OAuth app's client id) is set in the dashboard or here, e.g. GITHUB_CLIENT_ID = "Iv1.abc..."
# What sign-in asks GitHub for: "repo" reaches public and private repositories (it is what GitHub needs to comment on private ones).
# Use "public_repo" to limit Rico to public repositories.
OAUTH_SCOPE = "repo"

# Secrets (never commit them):
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET     # any long random string, e.g. `openssl rand -base64 32`

# Optional, recommended: keep the encrypted session in KV instead of entirely in the cookie. The key is split
# between SESSION_SECRET (server) and a random half that only the cookie holds, and signing out revokes the session.
#   npx wrangler kv namespace create SESSIONS     (then paste the id below and uncomment)
[[kv_namespaces]]
binding = "SESSIONS"
id = "4cc5499ef6ed4dc5bc4ba5eff5c02ed3"

# Usage by GitHub login (see /privacy), read with `npm run usage`. Created on first write.
[[analytics_engine_datasets]]
binding = "AU"
dataset = "active_users"

[observability]
enabled = true

[[ratelimits]]
name = "PREVIEW_LIMIT"
namespace_id = "1001"
simple = { limit = 150, period = 60 }

[[ratelimits]]
name = "ERROR_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Staging (npm run deploy:stage:embed): same as [env.stage] in wrangler.toml.
[env.stage]
name = "rico-stage"
routes = [{ pattern = "stage.ricorico.dev", custom_domain = true }]

[env.stage.vars]
GITHUB_CLIENT_ID = "Ov23lijOuGwLW5Cqcg9L"   # the stage OAuth app (callback https://stage.ricorico.dev/auth/callback)
OAUTH_SCOPE = "repo"

[env.stage.observability]
enabled = true

[[env.stage.ratelimits]]
name = "PREVIEW_LIMIT"
namespace_id = "2001"
simple = { limit = 150, period = 60 }

[[env.stage.ratelimits]]
name = "ERROR_LIMIT"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[env.stage.kv_namespaces]]
binding = "SESSIONS"
id = "752131a96ec94725bd79ceb2461921bd"   # stage-SESSIONS, separate from production

[[env.stage.analytics_engine_datasets]]
binding = "AU"
dataset = "active_users_stage"

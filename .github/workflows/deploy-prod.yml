name: Deploy production
# Every push to `main` deploys https://ricorico.dev (the `rico` Worker) after the tests pass, then checks that the
# live site answers. Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the same ones
# deploy-stage.yml uses). To hold deploys for approval, add required reviewers to the `production` environment
# (Settings > Environments). A bad deploy: roll back with `npx wrangler rollback`, or re-run this workflow on an older commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ricorico.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test the live site
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://ricorico.dev/api/me | grep -q '"hosted":true' && curl -fsS -o /dev/null https://ricorico.dev/privacy; then echo "live site OK"; exit 0; fi
            echo "not ready yet ($i)"; sleep 10
          done
          echo "::error::ricorico.dev did not answer correctly after the deploy"; exit 1

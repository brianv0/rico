name: Deploy stage
# Every push to the `stage` branch deploys to https://stage.ricorico.dev (the rico-stage Worker, [env.stage] in wrangler.toml).
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, Workers KV: Edit, Zone/DNS for ricorico.dev)
# and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [stage]
  workflow_dispatch:

concurrency:
  group: deploy-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: stage
      url: https://stage.ricorico.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run deploy:stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Rico</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230969da'/%3E%3Cpath d='M8 9h16v10H15l-5 4v-4H8z' fill='white'/%3E%3C/svg%3E">
<!-- GitHub's own markdown styles (github-markdown-css) and code colours (highlight.js github themes) -->
<link rel="stylesheet" href="/vendor/github-markdown.css">
<link rel="stylesheet" href="/vendor/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="gh-nav">
  <a class="gh-brand" href="/" aria-label="Rico home"><span class="gh-brand-mark" id="brand-mark"></span><span>Rico</span><small>rich comments</small></a>
  <form id="load" autocomplete="off">
    <input id="pr" type="text" spellcheck="false" aria-label="Pull request" placeholder="https://github.com/owner/repo/pull/123  or  owner/repo#123">
    <button type="submit" class="btn">Load PR</button>
  </form>
  <div id="status" role="status"></div>
</header>

<section id="prhead" hidden>
  <div class="container">
    <h1 class="gh-title"><span id="pr-title"></span> <span class="gh-num" id="pr-num"></span></h1>
    <div class="gh-meta"><span id="pr-state" class="State"></span><span id="pr-meta"></span></div>
    <nav class="tabnav" id="tabs" aria-label="Pull request tabs"></nav>
  </div>
</section>

<div id="toolbar" class="toolbar" hidden>
  <div class="toolbar-in">
    <button id="tree-toggle" class="btn btn-icon" type="button" title="Toggle file tree" aria-label="Toggle file tree" aria-expanded="true"></button>
    <span id="totals"></span>
    <span class="spacer"></span>
    <div class="review-wrap">
      <button id="review-btn" class="btn btn-primary" type="button" aria-haspopup="dialog" aria-expanded="false">Review changes <span id="rc-count" class="Counter" hidden></span><span id="rc-caret"></span></button>
      <div id="review-pop" class="Popover" role="dialog" aria-label="Finish your review" hidden>
        <div class="pop-head"><strong>Finish your review</strong><button id="review-close" class="btn-link" type="button" aria-label="Close">×</button></div>
        <div class="pop-body">
          <textarea id="summary" rows="4" aria-label="Review summary" placeholder="Leave a comment"></textarea>
          <fieldset class="radios">
            <label><input type="radio" name="event" value="COMMENT" checked><span><b>Comment</b><small>Submit general feedback without explicit approval.</small></span></label>
            <label><input type="radio" name="event" value="APPROVE"><span><b>Approve</b><small>Submit feedback and approve merging these changes.</small></span></label>
            <label><input type="radio" name="event" value="REQUEST_CHANGES"><span><b>Request changes</b><small>Submit feedback that must be addressed before merging.</small></span></label>
          </fieldset>
          <details id="pending" open>
            <summary>Pending comments <span id="count"></span></summary>
            <div id="list"><p class="empty">No pending comments.</p></div>
          </details>
        </div>
        <div class="pop-foot"><div id="result"></div><button id="submit" class="btn btn-primary" type="button" disabled>Submit review</button></div>
      </div>
    </div>
  </div>
</div>

<div class="container layout" id="layout">
  <aside id="side">
    <div class="tree-head">
      <input id="tree-filter" type="search" aria-label="Filter changed files" placeholder="Filter changed files">
      <div id="viewed-count"></div>
    </div>
    <nav id="files" aria-label="Changed files"></nav>
  </aside>

  <main id="main">
    <div id="legend" hidden>
      <span><i class="k chg"></i>changed</span>
      <span><i class="k del"></i>removed</span>
      <span><i class="k ctx"></i>commentable context</span>
      <span><i class="k out"></i>outside the diff (goes in review summary)</span>
    </div>
    <div id="cards"><p class="empty intro">Paste a PR link above. Then select any text &mdash; across as many paragraphs as you like &mdash; and a comment box appears over it.</p></div>
    <div id="composer" hidden>
      <blockquote id="c-quote"></blockquote>
      <div id="c-range"></div>
      <div class="qrow"><label><input type="checkbox" id="c-qinc"> Include quote</label><button type="button" id="c-qedit" class="linkish" aria-expanded="false">edit</button><span id="c-qnote"></span></div>
      <textarea id="c-qtext" rows="4" hidden spellcheck="false" aria-label="Quote (markdown)"></textarea>
      <textarea id="c-body" rows="3" placeholder="Leave a comment…  (Ctrl/Cmd+Enter to add, Esc to dismiss)"></textarea>
      <div class="row"><button id="c-add" class="btn btn-primary" type="button">Add review comment</button><button id="c-cancel" class="btn" type="button">Cancel</button></div>
    </div>
  </main>
</div>

<script src="/vendor/hljs.js"></script>
<script src="/vendor/purify.js"></script>
<script src="vendor/markdown-it.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

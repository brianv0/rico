name = "rico"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Served at https://ricorico.dev (the domain must be a zone in your Cloudflare account; deploy creates the DNS record)
routes = [{ pattern = "ricorico.dev", custom_domain = true }]

# Keep variables set in the Cloudflare dashboard (such as GITHUB_CLIENT_ID) when deploying from here.
keep_vars = true

# the static app, built by `npm run build`
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"   # /github.com/owner/repo/7 serves the app
run_worker_first = ["/api/*", "/auth/*", "/github.com/*"]   # PR pages too: see the Worker

[vars]
# GITHUB_CLIENT_ID (not secret; the OAuth app's client id) is set in the dashboard or here, e.g. GITHUB_CLIENT_ID = "Iv1.abc..."
# What sign-in asks GitHub for: "repo" reaches public and private repositories (it is what GitHub needs to comment on private ones).
# Use "public_repo" to limit Rico to public repositories.
OAUTH_SCOPE = "repo"

# Secrets (never commit them):
#   npx wrangler secret put GITHUB_CLIENT_SECRET
#   npx wrangler secret put SESSION_SECRET     # any long random string, e.g. `openssl rand -base64 32`

# Optional, recommended: keep the encrypted session in KV instead of entirely in the cookie. The key is split
# between SESSION_SECRET (server) and a random half that only the cookie holds, and signing out revokes the session.
#   npx wrangler kv namespace create SESSIONS     (then paste the id below and uncomment)
[[kv_namespaces]]
binding = "SESSIONS"
id = "4cc5499ef6ed4dc5bc4ba5eff5c02ed3"

# Usage: each signed-in app load and posted comment is one data point with the user's GitHub login (see /privacy),
# read with `npm run usage`. Kept by Cloudflare for about three months. Created on first write.
[[analytics_engine_datasets]]
binding = "AU"
dataset = "active_users"

# Logs and traces in the dashboard (Workers & Pages > rico > Observability), including the client errors that
# public/report.js posts to /api/client-error.
[observability]
enabled = true

# Per-IP request limits (fixed window). PREVIEW_LIMIT guards signed-out preview reads, which share one GitHub token and its
# rate limit (cached reads do not count; a PR with many files makes one request per file, hence the headroom).
# ERROR_LIMIT guards the browser error reports. namespace_id is any integer, unique within the account.
[[ratelimits]]
name = "PREVIEW_LIMIT"
namespace_id = "1001"
simple = { limit = 150, period = 60 }

[[ratelimits]]
name = "ERROR_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Staging: the same Worker as its own deployment at https://stage.ricorico.dev (`npm run deploy:stage`).
# It needs its own GitHub OAuth app (callback https://stage.ricorico.dev/auth/callback) and its own secrets:
#   npx wrangler secret put GITHUB_CLIENT_SECRET --env stage
#   npx wrangler secret put SESSION_SECRET --env stage
# GITHUB_CLIENT_ID for the stage OAuth app is in [env.stage.vars] below.
[env.stage]
name = "rico-stage"
routes = [{ pattern = "stage.ricorico.dev", custom_domain = true }]

[env.stage.vars]
GITHUB_CLIENT_ID = "Ov23lijOuGwLW5Cqcg9L"   # the stage OAuth app (callback https://stage.ricorico.dev/auth/callback)
OAUTH_SCOPE = "repo"

[env.stage.observability]
enabled = true

[[env.stage.ratelimits]]
name = "PREVIEW_LIMIT"
namespace_id = "2001"
simple = { limit = 150, period = 60 }

[[env.stage.ratelimits]]
name = "ERROR_LIMIT"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[env.stage.kv_namespaces]]
binding = "SESSIONS"
id = "752131a96ec94725bd79ceb2461921bd"   # stage-SESSIONS, separate from production

[[env.stage.analytics_engine_datasets]]
binding = "AU"
dataset = "active_users_stage"
